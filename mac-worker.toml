# Mac, process 2 of 2: a worker. Serves the heavy tiers (chat + agent) from the
# Mac's own Ollama and heartbeats its state to the coordinator.

[runtime]
backend = "ollama"
offline = false
ollama_url = "http://127.0.0.1:11434"

[server]
host = "0.0.0.0"
port = 11435

[memory]
ceiling_gb = 24
warm_pool = []

[routing.chat]
model = "qwen3:8b"
[routing.agent]
model = "qwen3-coder:30b"

[cluster]
role = "worker"
coordinator_url = "http://192.168.2.18:11436"
node_name = "mac"
advertise_url = "http://192.168.2.18:11435"
