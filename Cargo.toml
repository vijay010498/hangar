[workspace]
resolver = "2"
members = [
    "crates/hangar-core",
    "crates/hangard",
    "crates/hangar-tui",
    "crates/hangar-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "local"

[workspace.dependencies]
hangar-core = { path = "crates/hangar-core" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ratatui = "0.29"
async-stream = "0.3"
futures-util = "0.3"
similar = "2"
regex = "1"
walkdir = "2"
glob = "0.3"
